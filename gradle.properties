# Specifying JVM arguments for Gradle daemon to allocate enough heap memory
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC

# Enable AndroidX support
android.useAndroidX=true

# Enable Kotlin code style
kotlin.code.style=official

# Enable Gradle build cache and parallel execution
org.gradle.caching=true
org.gradle.parallel=true
